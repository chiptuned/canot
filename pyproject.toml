[project]
name = "canot"
version = "0.6.1"
description = "Prouvez que vous pouvez partir : exercice de sortie Snowflake/Databricks vers Apache Iceberg, avec dossier de preuve."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vincent Fraillon" }]
keywords = ["data", "snowflake", "bigquery", "databricks", "iceberg", "migration", "reversibility", "DORA", "data-act", "sovereign-cloud"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=16",
  "pyiceberg[sql-sqlite]>=0.8",
  "sqlglot>=25",
  "cryptography>=42",
  "pyyaml>=6",  # dbt_project.yml and profiles.yml (canot drill dbt://), read with safe_load
  "mcp>=1.2",
]

[project.urls]
Homepage = "https://canot.io"
Source = "https://github.com/q4o-paris/canot"
Issues = "https://github.com/q4o-paris/canot/issues"

[project.optional-dependencies]
# drivers of the warehouses, installed on demand: uvx "canot[snowflake]" drill …
snowflake = ["snowflake-connector-python>=3.12"]
bigquery = ["google-cloud-bigquery[bqstorage]>=3.25"]
databricks = ["databricks-sql-connector>=3.5"]
postgres = ["psycopg2-binary>=2.9"]
mcp = []  # installé d'office
all = ["psycopg2-binary>=2.9", "snowflake-connector-python>=3.12", "google-cloud-bigquery[bqstorage]>=3.25", "databricks-sql-connector>=3.5"]
dev = ["pytest>=8", "moto[server,s3]>=5", "snowflake-connector-python>=3.12", "google-cloud-bigquery[bqstorage]>=3.25", "databricks-sql-connector>=3.5"]
docs = ["mkdocs-material>=9.5", "mkdocs<2"]

[project.scripts]
canot = "canot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canot"]

[tool.hatch.build.targets.wheel.force-include]
"docs/commands.md" = "canot/docs/commands.md"
"docs/scan.md" = "canot/docs/scan.md"
"docs/on-prem.md" = "canot/docs/on-prem.md"
"docs/targets.md" = "canot/docs/targets.md"
"docs/discrepancies.md" = "canot/docs/discrepancies.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
