[project]
name = "canot"
version = "0.1.0"
description = "Prouvez que vous pouvez partir : exercice de sortie Snowflake/Databricks vers Apache Iceberg, avec dossier de preuve."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=16",
  "pyiceberg[sql-sqlite]>=0.8",
  "sqlglot>=25",
  "cryptography>=42",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.12"]
databricks = ["databricks-sql-connector>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
canot = "canot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
