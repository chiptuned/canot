[project]
name = "canot"
version = "0.1.0"
description = "Prouvez que vous pouvez partir : exercice de sortie Snowflake/Databricks vers Apache Iceberg, avec dossier de preuve."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vincent Fraillon" }]
keywords = ["data", "snowflake", "bigquery", "databricks", "iceberg", "migration", "reversibility", "DORA", "data-act", "sovereign-cloud"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=16",
  "pyiceberg[sql-sqlite]>=0.8",
  "sqlglot>=25",
  "cryptography>=42",
]

[project.urls]
Homepage = "https://canot.io"
Source = "https://github.com/chiptuned/canot"
Issues = "https://github.com/chiptuned/canot/issues"

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.12"]
bigquery = ["google-cloud-bigquery[bqstorage]>=3.25"]
databricks = ["databricks-sql-connector>=3.5"]
postgres = ["psycopg2-binary>=2.9"]
all = ["snowflake-connector-python[pandas]>=3.12", "google-cloud-bigquery[bqstorage]>=3.25", "databricks-sql-connector>=3.5", "psycopg2-binary>=2.9"]
dev = ["pytest>=8", "moto[server,s3]>=5"]

[project.scripts]
canot = "canot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
