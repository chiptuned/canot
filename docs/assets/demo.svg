<text x="470.0" y="31" text-anchor="middle" fill="#7D8FA3" style="font-size:13px">canot : exercice de sortie</text>
<text class="l0" x="28" y="86" fill="#E6EDF3" font-weight="700" xml:space="preserve">$ canot drill --from &quot;bigquery://MON-PROJET/thelook_ecommerce?location=US&quot; --to ./lac</text><text class="l1" x="28" y="111" fill="#7D8FA3" xml:space="preserve">→ inventaire</text><text class="l2" x="28" y="136" fill="#7D8FA3" xml:space="preserve">→ copie de 7 table(s) vers local:./lac</text><text class="l3" x="28" y="161" fill="#B9C6D3" xml:space="preserve">   events            2 423 210 lignes   437,7 Mo    7,2 s</text><text class="l4" x="28" y="186" fill="#B9C6D3" xml:space="preserve">   inventory_items     488 835 lignes    88,5 Mo    3,5 s</text><text class="l5" x="28" y="211" fill="#B9C6D3" xml:space="preserve">   order_items         181 071 lignes    16,8 Mo    3,3 s</text><text class="l6" x="28" y="236" fill="#7D8FA3" xml:space="preserve">→ comparaison des tables</text><text class="l7" x="28" y="261" fill="#56D364" xml:space="preserve">   events            OK    orders        OK    users      OK</text><text class="l8" x="28" y="286" fill="#56D364" xml:space="preserve">   inventory_items   OK    order_items   OK    products   OK</text><text class="l9" x="28" y="311" fill="#7D8FA3" xml:space="preserve">→ rejeu de 4 requêtes des deux côtés</text><text class="l10" x="28" y="336" fill="#56D364" xml:space="preserve">   <tspan fill="#56D364">[match]</tspan>     select status, count(*) as n from orders …</text><text class="l11" x="28" y="361" fill="#56D364" xml:space="preserve">   <tspan fill="#56D364">[match]</tspan>     select p.category, round(sum(oi.sale_price), 2) …</text><text class="l12" x="28" y="386" fill="#FF9A55" xml:space="preserve">   <tspan fill="#FF9A55">[mismatch]</tspan>  select date_trunc(date(created_at), month) …</text><text class="l13" x="28" y="411" fill="#56D364" xml:space="preserve">   <tspan fill="#56D364">[match]</tspan>     select country, count(*) as users, avg(age) …</text><text class="l14" x="28" y="436" fill="#FFFFFF" font-weight="700" xml:space="preserve">Parité : écarts — 7/7 tables, 3/4 requêtes</text><text class="l15" x="28" y="461" fill="#7D8FA3" xml:space="preserve">Dossier : canot-out/report.html   (journal signé, vérifiable)</text>
</svg>
