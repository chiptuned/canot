<text x="470.0" y="31" text-anchor="middle" fill="#7D8FA3" style="font-size:13px">canot: exit exercise</text>
<text class="l0" x="28" y="86" fill="#E6EDF3" font-weight="700" xml:space="preserve">$ uvx canot demo</text><text class="l1" x="28" y="111" fill="#7D8FA3" xml:space="preserve">canot demo is a shortcut for two commands, which you can run and change yourself:</text><text class="l2" x="28" y="136" fill="#B9C6D3" xml:space="preserve">  canot demo-data canot-demo/demo.duckdb --tpch --sf 0.1</text><text class="l3" x="28" y="161" fill="#B9C6D3" xml:space="preserve">  canot drill canot-demo/demo.duckdb canot-demo/iceberg --queries … --out …</text><text class="l4" x="28" y="186" fill="#7D8FA3" xml:space="preserve">TPC-H: 8 tables, 22 queries, 4 of them replayed here: about 100 MB of data</text><text class="l5" x="28" y="211" fill="#7D8FA3" xml:space="preserve">→ copying 8 table(s) to local:canot-demo/iceberg</text><text class="l6" x="28" y="236" fill="#B9C6D3" xml:space="preserve">   tpch.lineitem: 600572 rows, 109.9 MB</text><text class="l7" x="28" y="261" fill="#B9C6D3" xml:space="preserve">   tpch.orders: 150000 rows, 19.5 MB</text><text class="l8" x="28" y="286" fill="#B9C6D3" xml:space="preserve">   tpch.partsupp: 80000 rows, 13.4 MB</text><text class="l9" x="28" y="311" fill="#7D8FA3" xml:space="preserve">→ comparing tables</text><text class="l10" x="28" y="336" fill="#56D364" xml:space="preserve">   customer OK   nation OK   orders OK   part OK   partsupp OK   region OK   supplier OK</text><text class="l11" x="28" y="361" fill="#FF9A55" xml:space="preserve">   lineitem  MISMATCH</text><text class="l12" x="28" y="386" fill="#7D8FA3" xml:space="preserve">→ replaying 4 query(ies) on both sides</text><text class="l13" x="28" y="411" fill="#56D364" xml:space="preserve">   <tspan fill="#56D364">[match]</tspan>     select l_returnflag, l_linestatus, sum(l_quantity) …</text><text class="l14" x="28" y="436" fill="#56D364" xml:space="preserve">   <tspan fill="#56D364">[match]</tspan>     select l_orderkey, sum(l_extendedprice * (1 - l_discount)) …</text><text class="l15" x="28" y="461" fill="#56D364" xml:space="preserve">   <tspan fill="#56D364">[match]</tspan>     select sum(l_extendedprice * l_discount) as revenue …</text><text class="l16" x="28" y="486" fill="#FF9A55" xml:space="preserve">   <tspan fill="#FF9A55">[mismatch]</tspan>  select * from tpch.lineitem order by l_orderkey …</text><text class="l17" x="28" y="511" fill="#FFFFFF" font-weight="700" xml:space="preserve">Differences found: 7/8 tables match, 3/4 queries return the same result.</text><text class="l18" x="28" y="536" fill="#7D8FA3" xml:space="preserve">Evidence report: canot-demo/evidence/report.html   (signed log, verifiable)</text>
</svg>
