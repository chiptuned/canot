name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: ""   # not forced: Canot must write UTF-8 explicitly, as on a user's Windows machine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      # a user's `uvx canot` has no pandas: test the same way
      - run: uv pip uninstall pandas
      - run: uv run --no-sync python -m pytest -q
