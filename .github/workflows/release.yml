name: PyPI release
# Published with Trusted Publishing: no PyPI token is stored in GitHub.
# One-time setup on pypi.org: project canot, Publishing, Add a trusted publisher (GitHub: q4o-paris/canot, workflow release.yml).
# Manual for now: releases are published to PyPI with a token from the maintainer's machine until Trusted Publishing is set up
# (then switch the trigger back to `push: tags: ["v*"]`).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
