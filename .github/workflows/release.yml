name: PyPI release
# Published with Trusted Publishing: no PyPI token is stored in GitHub.
# One-time setup on pypi.org: project canot, Publishing, Add a trusted publisher (GitHub: chiptuned/canot, workflow release.yml).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
